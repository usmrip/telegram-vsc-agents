name: Publish Extension to VS Code Marketplace

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_version:
        description: 'Tipe kenaikan versi (opsional)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
  release:
    types: [published]

jobs:
  publish:
    name: Build & Publish VSIX
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # WAJIB: Autentikasi OIDC untuk Trusted Publishing ke VS Code Marketplace

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'vscode-extension/package-lock.json'

      - name: 📦 Install Dependencies
        run: |
          cd vscode-extension
          npm install

      - name: 🔢 Bump Version (Opsional via Manual Dispatch)
        if: github.event.inputs.bump_version != '' && github.event.inputs.bump_version != 'none'
        run: |
          cd vscode-extension
          npm version ${{ github.event.inputs.bump_version }} --no-git-tag-version

      - name: 🔨 Build VSIX Package
        run: |
          node vscode-extension/build-vsix.js

      - name: 📤 Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tele-vs-code-vsix
          path: tele-vs-code-*.vsix
          if-no-files-found: error

      - name: 🚀 Publish to VS Code Marketplace (PAT / Trusted Publishing)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          cd vscode-extension
          VSIX_FILE=$(node -p "const p = require('./package.json'); p.name + '-' + p.version + '.vsix'")
          echo "📦 Menyiapkan publikasi berkas: $VSIX_FILE"
          if [ ! -f "$VSIX_FILE" ]; then
            echo "❌ Berkas $VSIX_FILE tidak ditemukan di folder vscode-extension!"
            ls -la
            exit 1
          fi

          TOKEN="${VSCE_PAT:-${VSCE_TOKEN:-${MARKETPLACE_TOKEN:-}}}"

          if [ -n "$TOKEN" ]; then
            echo "🔑 Menggunakan Token PAT dari GitHub Secrets..."
            npx --yes @vscode/vsce@latest publish --packagePath "$VSIX_FILE" -p "$TOKEN" --skip-duplicate
          else
            echo "🛡️ PAT tidak terdeteksi di Secrets, mencoba OIDC Trusted Publishing Microsoft..."
            npx --yes @vscode/vsce@latest publish --packagePath "$VSIX_FILE" --oidc --skip-duplicate || {
              echo "⚠️ Catatan: Untuk publish otomatis ke VS Code Marketplace, pastikan Secret 'VSCE_PAT' atau OIDC Trusted Publishing sudah dikonfigurasi di GitHub Repository Settings -> Secrets and variables -> Actions."
              echo "Paket VSIX resmi telah berhasil dibuat dan disimpan sebagai Artifact workflow."
            }
          fi

      - name: 🏷️ Release to GitHub Releases (Jika Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tele-vs-code-*.vsix
          generate_release_notes: true
